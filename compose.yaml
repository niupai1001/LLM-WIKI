services:
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["python", "-m", "station.worker"]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "127.0.0.1:8765:8765"
  collector:
    profiles: ["collect"]
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: ["python", "-m", "station.cli", "loop", "--minutes", "30"]
